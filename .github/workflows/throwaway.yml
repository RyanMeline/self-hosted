name: Call Self Hosted
on:
  workflow_dispatch:

jobs:
  hi:
    runs-on: [self-hosted, random-label]
    steps:
      - name: hi
        run: echo "hello world"
  other_one:
    runs-on: [self-hosted, vagrant]
    steps:
      - name: test
        run: echo "hello from vagrant"
  third-times-the-charm:
    runs-on: [self-hosted, ec2]
    steps:
      - name: test
        run: echo "Hello from the ec2 instance"
